<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlik Ekle</title>
    <link rel="stylesheet" href="2416501033.css">
</head>
<body>
<header>
    <h1>Etkinlik Ekle</h1>
    <nav>
        <a href="index.html">Ana Sayfa</a>
          <a href="etkinlikler.html">Etkinlikler</a>
          <a href="etkinlik-ekle.html">Ekle</a>
          <a href="etkinlik-guncelle.html">Güncelle</a>

    </nav>
</header>
    <main>
    <form class="etkinlik-form">
      <div class="form-grup">
        <label for="ad">Etkinlik adı</label>
        <input type="text" id="ad" name="ad">
      </div>

      <div class="form-grup">
        <label for="kategori">Kategori</label>
        <select id="kategori" name="kategori">
          <option value="" selected>Seçiniz ▾</option>
          <option value="seminer">Seminer</option>
          <option value="atolye">Atölye</option>
          <option value="soylesi">Söyleşi</option>
        </select>
      </div>

      <div class="form-grup">
        <label for="tarih">Tarih</label>
        <input type="text" id="tarih" name="tarih" class="hata" value="boş bırakıldı">
      </div>

      <div class="form-grup">
        <label for="aciklama">Açıklama</label>
        <textarea id="aciklama" name="aciklama" rows="3"></textarea>
      </div>

      <button type="submit" class="btn-primary">Kaydet</button>
    </form>
  </main>
</body>
</html>
